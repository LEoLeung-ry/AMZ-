name: V3 regression tests

on:
  push:
    branches: [multisite-v3-beta]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Compile source
        run: python -m py_compile dashboard.py app_v32.py amz_intelligence/*.py tests/*.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Run legacy and v3.2 Streamlit UI smoke tests
        run: |
          PYTHONPATH=. python tests/run_ui_smoke.py
          PYTHONPATH=. python tests/run_ui_smoke_v32.py

  live-source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: [JP, US, DE, UK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -q --upgrade pip && pip install -q -r requirements.txt
      - name: Check live source HTTP response
        run: PYTHONPATH=. python tests/check_source_http.py ${{ matrix.market }}
      - name: Parse standardize score gate and convert live source
        run: PYTHONPATH=. python tests/live_source_smoke.py ${{ matrix.market }}
